[base]
package = chess
env_name = chess
policy_name = Policy

[env]
num_envs = 1024
max_steps = 256
illegal_move_penalty = -0.1
reward_invalid_piece = -0.01
reward_invalid_move = -0.01
reward_valid_piece = 0.0
reward_valid_move = 0.0
reward_capture_bonus = 0.002
reward_check_bonus = 0.001
reward_repetition = -0.01
reward_material = 0.005
reward_position = 0.002
reward_castling = 0.005
reward_draw = -0.03
reward_truncation = -0.10
reward_see_hanging = -0.005
enable_50_move_rule = 1
enable_threefold_repetition = 1
use_native_qpolicy = 0
qpolicy_path =
qpolicy_root_cap = 12
fen_file = curriculum_mixed.txt
fen_curric_pct = 0.9

[policy]
hidden_size = 256

[train]
device = cuda
precision = bfloat16
use_rnn = False
total_timesteps = 1_000_000_000
learning_rate = 2.5e-4
gamma = 0.99
gae_lambda = 0.95
clip_coef = 0.2
update_epochs = 1
ent_coef = 0.001
batch_size = 262144
minibatch_size = 65536
bptt_horizon = 128
