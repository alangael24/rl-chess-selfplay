[base]
package = chess
env_name = chess
policy_name = Policy

[env]
num_envs = 1024
max_steps = 256
illegal_move_penalty = -0.1
use_native_qpolicy = 0
qpolicy_path =
qpolicy_root_cap = 12

[policy]
hidden_size = 256

[train]
device = cuda
precision = bfloat16
use_rnn = False
total_timesteps = 1_000_000_000
learning_rate = 2.5e-4
gamma = 0.99
gae_lambda = 0.95
clip_coef = 0.2
update_epochs = 1
ent_coef = 0.001
batch_size = 262144
minibatch_size = 65536
bptt_horizon = 128
