[base]
package = chess
env_name = chess
policy_name = Policy

[env]
num_envs = 2048
max_steps = 256
illegal_move_penalty = -0.1

[policy]
hidden_size = 512
num_blocks = 4

[train]
device = cuda
total_timesteps = 1_000_000_000
learning_rate = 2.5e-4
gamma = 0.99
gae_lambda = 0.95
clip_coef = 0.2
update_epochs = 4
ent_coef = 0.001
batch_size = 131072
minibatch_size = 16384
bptt_horizon = 16
